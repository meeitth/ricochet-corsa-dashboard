        }

        const normalizeCategoryOverview = (category, productName = '') => {
          const cat = String(category || '').toLowerCase().trim();
          const name = String(productName || '').toLowerCase().trim();
          const str = cat + ' ' + name;
          
          if (str.includes('xpod') || str.includes('bean') || str.includes('sachet') || str.includes('consumable')) {
            return 'xPod and beans';
          }
          
          const isAccessory = str.includes('accessories') || str.includes('filter') || str.includes('tea brewer') || str.includes('coffee spoon') || str.includes('kinto') || str.includes('omni dripper') || str.includes('travel bag') || str.includes('inline water pressure') || str.includes('magnetic dosing cup') || str.includes('power cord') || str.includes('drip tray') || str.includes('water tank') || str.includes('dock stand') || str.includes('equipment');
          if (isAccessory) {
            return 'accessories';
          }
          
          if (str.includes('studio') || str.includes('machine') || str.includes('เครื่องชง') || str.includes('midnight black') || str.includes('moonlight white') || str.includes('sage green') || str.includes('twilight')) {
            return 'xBloom studio';
          }
          
          return 'accessories'; 
        };

        function App() {
          const [view, setView] = useState('overview'); 
          const [selectedPlatform, setSelectedPlatform] = useState('Shopee');
          const [dataSourceModalOpen, setDataSourceModalOpen] = useState(false);
          const [isCopied, setIsCopied] = useState(false);
          const [fetchErrors, setFetchErrors] = useState({});
          
          // ระบบ State ส่วนกลาง (Global Filter)
          const [globalFilterCriteria, setGlobalFilterCriteria] = useState({ 
            activeFilters: { date: false, category: false, campaign: false, product: false }, 
            tempValues: { startDate: '', endDate: '', category: '', campaign: '', productName: '' } 
          });

          const [platformUrls, setPlatformUrls] = useState(() => {
            const saved = localStorage.getItem('xbloom_platform_urls');
            if (saved) {
               const parsed = JSON.parse(saved);
               return {
                  Shopee: parsed.Shopee || DEFAULT_PLATFORM_URLS.Shopee,
                  Lazada: parsed.Lazada || DEFAULT_PLATFORM_URLS.Lazada,
                  Line: parsed.Line || DEFAULT_PLATFORM_URLS.Line,
                  TikTok: parsed.TikTok || DEFAULT_PLATFORM_URLS.TikTok,
                  'Direct sales': parsed['Direct sales'] || DEFAULT_PLATFORM_URLS['Direct sales'],
                  'B2B': (parsed['B2B'] === DEFAULT_PLATFORM_URLS['Direct sales']) ? DEFAULT_PLATFORM_URLS['B2B'] : (parsed['B2B'] || DEFAULT_PLATFORM_URLS['B2B']),
                  'Store': (parsed['Store'] === DEFAULT_PLATFORM_URLS['Direct sales']) ? DEFAULT_PLATFORM_URLS['Store'] : (parsed['Store'] || DEFAULT_PLATFORM_URLS['Store']),
                  'Event': parsed['Event'] || DEFAULT_PLATFORM_URLS['Event']
               };
            }
            return DEFAULT_PLATFORM_URLS;
          });

          const [salesTargets, setSalesTargets] = useState(() => {
            const saved = localStorage.getItem('xbloom_sales_targets_dict');
            return saved ? JSON.parse(saved) : { '2026-04': 4000000 };
          });

          useEffect(() => { localStorage.setItem('xbloom_platform_urls', JSON.stringify(platformUrls)); }, [platformUrls]);
          useEffect(() => { localStorage.setItem('xbloom_sales_targets_dict', JSON.stringify(salesTargets)); }, [salesTargets]);

          const [globalData, setGlobalData] = useState([]);
          const [isGlobalLoading, setIsGlobalLoading] = useState(true);

          useEffect(() => {
            const fetchAllPlatforms = async () => {
               setIsGlobalLoading(true);
               setFetchErrors({});
               let allMergedData = [];
               let errors = {};
               for (const [platform, url] of Object.entries(platformUrls)) {
                  if (!url) continue;
                  try {
                     const res = await fetch(url);
                     if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
                     const text = await res.text();
                     
                     // ป้องกัน Google Sheets คืนค่าเป็นหน้าเว็บ HTML (ต้องเป็น CSV เท่านั้น)
                     if (text.trim().toLowerCase().startsWith('<!doctype html>')) {
                         throw new Error('Google Sheets is returning a web page instead of CSV. Please use "Publish to web" and select "CSV" format.');
                     }
                     
                     // ตรวจสอบว่าไฟล์ CSV เป็นไฟล์แยกเฉพาะ (Dedicated) หรือไม่
                     let isDedicated = false;
                     if (platform === 'Store' || platform === 'B2B' || platform === 'Event') {
                         isDedicated = url !== platformUrls['Direct sales'];
                     }

                     if (platform === 'Store') {
                         const rows2D = parseCSV2D(text);
                         const formatted = formatStoreData(rows2D, platform);
                         allMergedData = [...allMergedData, ...formatted];
                     } else if (platform === 'Event') {
                         const rows2D = parseCSV2D(text);
                         const formatted = formatEventData(rows2D, platform);
                         allMergedData = [...allMergedData, ...formatted];
                     } else if (platform === 'B2B') {
                         const rows2D = parseCSV2D(text);
                         const formatted = formatB2BData(rows2D, platform);
                         if (isDedicated && formatted.length === 0) {
                             const parsed = parseCSV(text);
                             if (parsed.length > 0) {
                                 const fallbackFormatted = formatRawData(parsed, platform);
                                 allMergedData = [...allMergedData, ...fallbackFormatted];
                                 continue;
                             }
                         }
                         allMergedData = [...allMergedData, ...formatted];
                     } else if (platform === 'Direct sales') {
                         const rows2D = parseCSV2D(text);
                         const formatted = formatDirectSalesData(rows2D, platform, isDedicated);
                         allMergedData = [...allMergedData, ...formatted];
                     } else {
                         const parsed = parseCSV(text);
                         const formatted = formatRawData(parsed, platform);
                         allMergedData = [...allMergedData, ...formatted];
                     }
                  } catch (e) { 
                      console.error(`Failed to fetch ${platform}:`, e); 
                      errors[platform] = e.message;
                  }
               }
               setGlobalData(allMergedData);
               setFetchErrors(errors);
               setIsGlobalLoading(false);
            };
            fetchAllPlatforms();
          }, [platformUrls]);

          const activeTargetMonth = useMemo(() => {
             const { activeFilters, tempValues } = globalFilterCriteria;
             if (activeFilters?.date && tempValues?.startDate) return tempValues.startDate.substring(0, 7); 
             const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth() + 1).padStart(2, '0');
             return `${y}-${m}`;
          }, [globalFilterCriteria]);

          const currentTargetGmv = salesTargets[activeTargetMonth] || 0;

          const overviewAvailableCategories = useMemo(() => {
             const categories = new Set(globalData.map(item => normalizeCategoryOverview(item.category, item.name))); return Array.from(categories).filter(Boolean).sort();
          }, [globalData]);

          const overviewAvailableCampaigns = useMemo(() => {
             const campaigns = new Set(globalData.map(item => item.campaign)); return Array.from(campaigns).filter(Boolean).sort();
          }, [globalData]);

          const overviewKpis = useMemo(() => {
            const { activeFilters, tempValues } = globalFilterCriteria;
            const baseData = globalData.filter(p => {
              let match = true;
              if (activeFilters?.category && tempValues?.category) { match = match && normalizeCategoryOverview(p.category, p.name) === tempValues.category; }
              if (activeFilters?.campaign && tempValues?.campaign) { match = match && p.campaign === tempValues.campaign; }
              if (activeFilters?.product && tempValues?.productName) { match = match && p.name.toLowerCase().includes(tempValues.productName.toLowerCase()); }
              return match;
            });

            const calc = (dataToCalc) => {
              let gmv = 0, sales = 0, visitors = 0, views = 0;
              dataToCalc.forEach(p => { gmv += p.gmv || 0; sales += p.sales || 0; visitors += p.visitors || 0; views += p.views || 0; });
              const aov = sales > 0 ? Math.round(gmv / sales) : 0;
              const cr = visitors > 0 ? Number(((sales / visitors) * 100).toFixed(2)) : 0;
              return { gmv, sales, aov, visitors, views, cr };
            };

            if (!activeFilters?.date || !tempValues.startDate || !tempValues.endDate) return { current: calc(baseData), lw: calc([]), lm: calc([]), ly: calc([]) };

            const startCurr = new Date(`${tempValues.startDate}T00:00:00`); const endCurr = new Date(`${tempValues.endDate}T23:59:59`);
            const startLW = shiftDateLW(startCurr); startLW.setHours(0,0,0,0); const endLW = shiftDateLW(endCurr); endLW.setHours(23,59,59,999);
            const startLM = shiftDateLM(startCurr); startLM.setHours(0,0,0,0); const endLM = shiftDateLM(endCurr); endLM.setHours(23,59,59,999);
            const startLY = shiftDateLY(startCurr); startLY.setHours(0,0,0,0); const endLY = shiftDateLY(endCurr); endLY.setHours(23,59,59,999);

            const currentData = [], lwData = [], lmData = [], lyData = [];
            baseData.forEach(p => {
               if(!p.date) return; const d = new Date(`${p.date}T12:00:00`);
               if (d >= startCurr && d <= endCurr) currentData.push(p);
               if (d >= startLW && d <= endLW) lwData.push(p);
               if (d >= startLM && d <= endLM) lmData.push(p);
               if (d >= startLY && d <= endLY) lyData.push(p);
            });
            return { current: calc(currentData), lw: calc(lwData), lm: calc(lmData), ly: calc(lyData) };
          }, [globalData, globalFilterCriteria]);

          const overviewCategoryData = useMemo(() => {
            const { activeFilters, tempValues } = globalFilterCriteria;
            let startCurr, endCurr;
            if (activeFilters?.date && tempValues?.startDate && tempValues?.endDate) { startCurr = new Date(`${tempValues.startDate}T00:00:00`); endCurr = new Date(`${tempValues.endDate}T23:59:59`); }
            const grouped = {};
            globalData.forEach(p => {
              let match = true;
              if (startCurr && endCurr) { if(!p.date) match = false; else { const d = new Date(`${p.date}T12:00:00`); if (d < startCurr || d > endCurr) match = false; } }
              if (activeFilters?.category && tempValues?.category) { match = match && normalizeCategoryOverview(p.category, p.name) === tempValues.category; }
              if (activeFilters?.campaign && tempValues?.campaign) { match = match && p.campaign === tempValues.campaign; }
              if (activeFilters?.product && tempValues?.productName) { match = match && p.name.toLowerCase().includes(tempValues.productName.toLowerCase()); }
              
              if (match) {
                 const catName = normalizeCategoryOverview(p.category, p.name);
                 if (!grouped[catName]) grouped[catName] = { gmv: 0, units: 0 };
                 grouped[catName].gmv += (p.gmv || 0); grouped[catName].units += (p.sales || 0);
               }
            });
            const totalGmv = Object.values(grouped).reduce((acc, curr) => acc + curr.gmv, 0);
            return Object.entries(grouped).map(([name, data], idx) => ({
              name, gmv: data.gmv, units: data.units, value: data.gmv, 
              percentage: totalGmv > 0 ? Math.round((data.gmv / totalGmv) * 100) : 0, color: CATEGORY_COLORS[idx % CATEGORY_COLORS.length]
            })).sort((a,b) => b.gmv - a.gmv);
          }, [globalData, globalFilterCriteria]);

          const overviewChannelData = useMemo(() => {
            const { activeFilters, tempValues } = globalFilterCriteria;
            let startCurr, endCurr;
            if (activeFilters?.date && tempValues?.startDate && tempValues?.endDate) { startCurr = new Date(`${tempValues.startDate}T00:00:00`); endCurr = new Date(`${tempValues.endDate}T23:59:59`); }
            const grouped = {};
            globalData.forEach(p => {
              let match = true;
              if (startCurr && endCurr) { if(!p.date) match = false; else { const d = new Date(`${p.date}T12:00:00`); if (d < startCurr || d > endCurr) match = false; } }
              if (activeFilters?.category && tempValues?.category) { match = match && normalizeCategoryOverview(p.category, p.name) === tempValues.category; }
              if (activeFilters?.campaign && tempValues?.campaign) { match = match && p.campaign === tempValues.campaign; }
              if (activeFilters?.product && tempValues?.productName) { match = match && p.name.toLowerCase().includes(tempValues.productName.toLowerCase()); }
              
              if (match) {
                 if (!grouped[p.platform]) grouped[p.platform] = { gmv: 0, units: 0 };
                 grouped[p.platform].gmv += (p.gmv || 0);
                 grouped[p.platform].units += (p.sales || 0);
              }
            });
            const totalGmv = Object.values(grouped).reduce((acc, curr) => acc + curr.gmv, 0);
            return Object.entries(grouped).map(([name, data]) => ({
              name, gmv: data.gmv, units: data.units, percentage: totalGmv > 0 ? Math.round((data.gmv / totalGmv) * 100) : 0, color: PLATFORM_COLORS[name] || '#94a3b8'
            })).sort((a,b) => b.gmv - a.gmv);
          }, [globalData, globalFilterCriteria]);

          const overviewTrendData = useMemo(() => {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const grouped = {};
            months.forEach(m => grouped[m] = { month: m, gmv2025: 0, gmv2026: 0 });
            globalData.forEach(p => {
                if(!p.date) return; const d = new Date(`${p.date}T12:00:00`);
                const m = months[d.getMonth()]; const y = d.getFullYear();
                if (y === 2025) grouped[m].gmv2025 += (p.gmv || 0); if (y === 2026) grouped[m].gmv2026 += (p.gmv || 0);
            });
            return Object.values(grouped);
          }, [globalData]);

          const handleCopySummary = () => {
            const { activeFilters, tempValues } = globalFilterCriteria;
            let filteredData = globalData;
            let dateHeader = "ช่วงเวลา: All Time";

            if (activeFilters?.date && tempValues?.startDate && tempValues?.endDate) {
                const startCurr = new Date(`${tempValues.startDate}T00:00:00`);
                const endCurr = new Date(`${tempValues.endDate}T23:59:59`);
                dateHeader = `ช่วงเวลา: ${tempValues.startDate} ถึง ${tempValues.endDate}`;
                
                filteredData = globalData.filter(p => {
                    if (!p.date) return false;
                    const d = new Date(`${p.date}T12:00:00`);
                    return d >= startCurr && d <= endCurr;
                });
            }

            const platforms = ['Shopee', 'Lazada', 'Line', 'TikTok', 'Direct sales', 'B2B', 'Store', 'Event'];
            let summaryText = `${dateHeader}\n\n`;
            
            let totalStudio = 0;
            let totalConsumable = 0;

            platforms.forEach(plat => {
                const platData = filteredData.filter(p => p.platform.toLowerCase() === plat.toLowerCase());
                let studioGmv = 0;
                let consumableGmv = 0;

                platData.forEach(p => {
                    const isStudio = checkIsStudio(p.category, p.name);
                    if (isStudio) {
                        studioGmv += (p.gmv || 0);
                    } else {
                        consumableGmv += (p.gmv || 0);
                    }
                });

                const totalPlat = studioGmv + consumableGmv;
                
                totalStudio += studioGmv;
                totalConsumable += consumableGmv;

                summaryText += `${plat}\n`;
                summaryText += `xBloom studio ยอดขาย ${studioGmv.toLocaleString('th-TH', {maximumFractionDigits:0})}\n`;
                summaryText += `xPod and beans and accessories ยอดขาย ${consumableGmv.toLocaleString('th-TH', {maximumFractionDigits:0})}\n`;
                summaryText += `ยอดขายรวม ${plat} ${totalPlat.toLocaleString('th-TH', {maximumFractionDigits:0})}\n\n`;
            });

            summaryText += `ยอดขายรวมทุก platform\n`;
            summaryText += `xBloom studio ยอดขาย ${totalStudio.toLocaleString('th-TH', {maximumFractionDigits:0})}\n`;
            summaryText += `xPod and beans and accessories ยอดขาย ${totalConsumable.toLocaleString('th-TH', {maximumFractionDigits:0})}\n`;
            summaryText += `ยอดขายรวม platform ${(totalStudio + totalConsumable).toLocaleString('th-TH', {maximumFractionDigits:0})}`;

            const textArea = document.createElement("textarea");
            textArea.value = summaryText;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                setIsCopied(true);
                setTimeout(() => setIsCopied(false), 2500); 
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
          };

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans p-4 md:p-10">
              <header className="max-w-7xl mx-auto flex flex-col xl:flex-row justify-between items-start xl:items-center mb-12 gap-6 xl:gap-4">
                <div className="flex flex-col lg:flex-row lg:items-center gap-6 lg:gap-8 min-w-0 w-full xl:w-auto">
                  <div className="shrink-0"><h1 className="text-4xl font-bold tracking-tighter text-slate-900">xBloom</h1><p className="text-slate-400 text-xs mt-2 flex items-center font-bold uppercase tracking-[4px]"><Calendar className="w-4 h-4 mr-2" /> E-commerce Dashboard</p></div>
                  <nav className="flex flex-wrap items-center gap-1 bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm w-full lg:w-auto overflow-x-auto">
                    <button onClick={() => setView('overview')} className={`flex items-center px-4 py-3 md:px-5 md:py-3 rounded-xl text-[11px] md:text-xs font-black uppercase tracking-widest transition-all shrink-0 ${view === 'overview' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-400 hover:text-slate-800 hover:bg-slate-50'}`}><Home className="w-4 h-4 mr-2" /> Overview</button>
                    {['Shopee', 'Lazada', 'Line', 'TikTok', 'Direct sales', 'B2B', 'Store', 'Event'].map((p) => (<button key={p} onClick={() => { setSelectedPlatform(p); setView('platform'); }} className={`flex items-center px-4 py-3 md:px-5 md:py-3 rounded-xl text-[11px] md:text-xs font-black uppercase tracking-widest transition-all shrink-0 ${view === 'platform' && selectedPlatform === p ? 'bg-slate-800 text-white shadow-md' : 'text-slate-400 hover:text-slate-800 hover:bg-slate-50'}`}><div className="w-2.5 h-2.5 rounded-full mr-2 shadow-sm" style={{ backgroundColor: PLATFORM_COLORS[p] }} />{p}</button>))}
                  </nav>
                </div>
                <div className="flex gap-3 w-full xl:w-auto shrink-0">
                  {view === 'overview' && (
                    <button onClick={handleCopySummary} className={`opacity-0 hover:opacity-100 focus:opacity-100 flex items-center justify-center px-5 py-3 border rounded-xl text-[11px] md:text-xs font-black uppercase tracking-widest shadow-sm transition-all duration-300 ${isCopied ? 'bg-emerald-50 border-emerald-200 text-emerald-600' : 'bg-white border-slate-200 text-indigo-600 hover:bg-slate-50'}`} title="Copy Summary">
                      {isCopied ? <Check className="w-4 h-4 md:mr-2" /> : <Copy className="w-4 h-4 md:mr-2" />} 
                      <span className="hidden md:inline">{isCopied ? 'Copied!' : 'Copy Summary'}</span>
                    </button>
                  )}
                  <button onClick={() => setDataSourceModalOpen(true)} className="flex items-center justify-center px-5 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl text-[11px] md:text-xs font-black uppercase tracking-widest hover:bg-slate-50 shadow-sm transition-all"><Database className="w-4 h-4 mr-2" /> <span className="hidden md:inline">Data Sync</span></button>
                  <button onClick={() => exportToCSV(globalData, 'xBloom_All_Data')} className="flex items-center justify-center px-5 py-3 bg-white border border-slate-200 text-slate-700 rounded-xl text-[11px] md:text-xs font-black uppercase tracking-widest hover:bg-slate-50 shadow-sm transition-all"><Download className="w-4 h-4 mr-2" /> <span>Export All</span></button>
                </div>
              </header>

              <main className="max-w-7xl mx-auto">
                {Object.keys(fetchErrors).length > 0 && (
                  <div className="bg-rose-50 border border-rose-200 text-rose-700 p-4 rounded-2xl mb-8 flex items-start gap-3 shadow-sm">
                    <AlertCircle className="w-5 h-5 shrink-0 mt-0.5 text-rose-500" />
                    <div>
                        <h4 className="font-bold text-sm text-rose-800">เกิดข้อผิดพลาดในการซิงค์ข้อมูล (Data Sync Failed)</h4>
                        <ul className="text-xs mt-1 space-y-1 text-rose-600">
                            {Object.entries(fetchErrors).map(([plat, err]) => <li key={plat}><b className="uppercase tracking-wider">{plat}:</b> {err}</li>)}
                        </ul>
                        <button onClick={() => setDataSourceModalOpen(true)} className="mt-3 text-xs font-bold bg-white text-rose-600 px-3 py-1.5 rounded-lg border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm">Check Data Settings</button>
                    </div>
                  </div>
                )}

                {view === 'overview' ? (
                  <div className="space-y-12 animate-in fade-in duration-1000">
                    <FilterBar onApply={(f) => setGlobalFilterCriteria(f)} selectedPlatform="All" availableCategories={overviewAvailableCategories} availableCampaigns={overviewAvailableCampaigns} currentFilters={globalFilterCriteria} />
                    
                    {isGlobalLoading ? (
                       <div className="py-20 text-center flex flex-col items-center">
                          <RefreshCw className="w-10 h-10 text-indigo-500 animate-spin mb-4" />
                          <p className="text-slate-500 font-bold uppercase tracking-widest">Aggregating Data...</p>
                       </div>
                    ) : (
                      <Fragment>
                        <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                          <StatCard title="Total GMV" value={overviewKpis.current.gmv} prefix="฿" prevLy={overviewKpis.ly.gmv} prevLw={overviewKpis.lw.gmv} prevLm={overviewKpis.lm.gmv} />
                          <StatCard title="Total Items Sold" value={overviewKpis.current.sales} prevLy={overviewKpis.ly.sales} prevLw={overviewKpis.lw.sales} prevLm={overviewKpis.lm.sales} />
                          <StatCard title="AOV" value={overviewKpis.current.aov} prefix="฿" prevLy={overviewKpis.ly.aov} prevLw={overviewKpis.lw.aov} prevLm={overviewKpis.lm.aov} />
                          <StatCard title="CR%" value={overviewKpis.current.cr} suffix="%" prevLy={overviewKpis.ly.cr} prevLw={overviewKpis.lw.cr} prevLm={overviewKpis.lm.cr} />
                          <StatCard title="Total Page Views" value={overviewKpis.current.views} prevLy={overviewKpis.ly.views} prevLw={overviewKpis.lw.views} prevLm={overviewKpis.lm.views} />
                          <StatCard title="Total Visitors" value={overviewKpis.current.visitors} prevLy={overviewKpis.ly.visitors} prevLw={overviewKpis.lw.visitors} prevLm={overviewKpis.lm.visitors} />
                        </section>
                        
                        <TargetAchievementCard actualGmv={overviewKpis.current.gmv} targetGmv={currentTargetGmv} activeMonth={activeTargetMonth} />

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
                          <div className="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col h-full">
                            <SectionTitle subtitle="Revenue by Category (All Platforms)">Category Share</SectionTitle>
                            <div className="h-[260px] relative mb-4">
                              <ResponsiveContainer width="100%" height="100%">
                                <PieChart><Pie data={overviewCategoryData} innerRadius={80} outerRadius={110} paddingAngle={5} dataKey="value" stroke="none" labelLine={false} label={renderCustomizedPieLabel}>{overviewCategoryData.map((c, i) => <Cell key={i} fill={c.color} />)}</Pie><Tooltip content={CustomCategoryTooltip} cursor={{fill: 'transparent'}} /></PieChart>
                              </ResponsiveContainer>
                            </div>
                            <PieChartLegend data={overviewCategoryData} />
                          </div>
                          <div className="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col h-full">
                            <SectionTitle subtitle="GMV Contribution by Platform">Channel Contribution</SectionTitle>
                            <div className="h-[260px] relative mb-4">
                              <ResponsiveContainer width="100%" height="100%">
                                <PieChart><Pie data={overviewChannelData} innerRadius={80} outerRadius={110} paddingAngle={5} dataKey="gmv" stroke="none" labelLine={false} label={renderCustomizedPieLabel}>{overviewChannelData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}</Pie><Tooltip content={CustomCategoryTooltip} cursor={{fill: 'transparent'}} /></PieChart>
                              </ResponsiveContainer>
                            </div>
                            <PieChartLegend data={overviewChannelData} />
                          </div>
                        </div>

                        <div className="bg-white p-10 rounded-[40px] border border-slate-100 shadow-sm">
                          <div className="flex justify-between items-center mb-10"><SectionTitle subtitle="Aggregated monthly comparison (All Platforms)">GMV Trend (2026 vs 2025)</SectionTitle></div>
                          <div className="h-[350px]">
                            <ResponsiveContainer width="100%" height="100%">
                              <AreaChart data={overviewTrendData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                <defs><linearGradient id="overviewGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#4f46e5" stopOpacity={0.2}/><stop offset="95%" stopColor="#4f46e5" stopOpacity={0}/></linearGradient></defs>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                <XAxis dataKey="month" axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 11, fontWeight: '600'}} />
                                <YAxis axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 11}} tickFormatter={(v) => `฿${(v/1000).toLocaleString()}k`} />
                                <Tooltip content={<CustomTrendTooltip />} />
                                <Area type="monotone" dataKey="gmv2025" stroke="#cbd5e1" strokeWidth={2} strokeDasharray="5 5" fill="transparent" name="2025" />
                                <Area type="monotone" dataKey="gmv2026" stroke="#4f46e5" strokeWidth={3} fillOpacity={1} fill="url(#overviewGradient)" name="2026" />
                              </AreaChart>
                            </ResponsiveContainer>
                          </div>
                        </div>
                      </Fragment>
                    )}
                  </div>
                ) : (
                  <PlatformDetailView selectedPlatform={selectedPlatform} onBack={() => setView('overview')} platformData={globalData.filter(d => d.platform === selectedPlatform)} isGlobalLoading={isGlobalLoading} filterCriteria={globalFilterCriteria} setFilterCriteria={setGlobalFilterCriteria} fetchErrors={fetchErrors} />
                )}
                <DataSourceModal isOpen={dataSourceModalOpen} onClose={() => setDataSourceModalOpen(false)} urls={platformUrls} onSave={setPlatformUrls} targets={salesTargets} onSaveTargets={setSalesTargets} />
                <footer className="flex flex-col md:flex-row justify-between items-center text-[10px] text-slate-400 py-16 border-t border-slate-100 mt-20 gap-6 uppercase font-black tracking-[4px] text-center"><div>E-commerce Intelligence | Central API Sync</div><p>© 2026 xBloom Coffee Tech Global.</p></footer>
              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
