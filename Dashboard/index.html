<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xBloom Sale Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel for parsing JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Custom Scrollbar for tables */
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body { margin: 0; padding: 0; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect, Fragment } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, 
          Cell, PieChart, Pie, Legend, AreaChart, Area
        } from 'https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0';
        import { 
          Calendar, ChevronDown, Download, TrendingUp, TrendingDown, 
          Search, ChevronLeft, Home, 
          X, RefreshCw, Target, 
          Check, Database, Lock, Save, AlertCircle, MapPin, Copy
        } from 'https://esm.sh/lucide-react@0.359.0?deps=react@18.2.0';
        import { ComposableMap, Geographies, Geography } from 'https://esm.sh/react-simple-maps@3.0.0?deps=react@18.2.0,react-dom@18.2.0';

        // --- Google Sheets Integration ---
        const DEFAULT_PLATFORM_URLS = {
          Shopee: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRF0ad8XUcRjW3YyHZsmKsnf3sK_B8aKkrS3Nu_xL0hn6AJziTLGuHYhdyzBmVE3Q/pub?gid=354235775&single=true&output=csv', 
          Lazada: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRF0ad8XUcRjW3YyHZsmKsnf3sK_B8aKkrS3Nu_xL0hn6AJziTLGuHYhdyzBmVE3Q/pub?gid=1095280982&single=true&output=csv', 
          Line: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRF0ad8XUcRjW3YyHZsmKsnf3sK_B8aKkrS3Nu_xL0hn6AJziTLGuHYhdyzBmVE3Q/pub?gid=222987836&single=true&output=csv',   
          TikTok: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRF0ad8XUcRjW3YyHZsmKsnf3sK_B8aKkrS3Nu_xL0hn6AJziTLGuHYhdyzBmVE3Q/pub?gid=222737378&single=true&output=csv',
          'Direct sales': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwg2EqSk_nW8ZZM8hsKDJmkyHUuX7rRMFLAH_tVSSzNJWYcYT_2G9q-XhFLM_a1w/pub?gid=1304035521&single=true&output=csv',
          'B2B': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwg2EqSk_nW8ZZM8hsKDJmkyHUuX7rRMFLAH_tVSSzNJWYcYT_2G9q-XhFLM_a1w/pub?gid=1176997376&single=true&output=csv',
          'Store': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQVXXd1h02IXve7b9X2wxYzZ7Cp23gBoszu3qmvEpsdLrlJVmJyPTh6WbQeUIXaQw/pub?gid=1208508020&single=true&output=csv',
          'Event': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQwg2EqSk_nW8ZZM8hsKDJmkyHUuX7rRMFLAH_tVSSzNJWYcYT_2G9q-XhFLM_a1w/pub?gid=989836339&single=true&output=csv'
        };

        const ADMIN_PASSCODE = "xbloom2026";

        // Raw 2D Array parser for complex crosstab formats
        const parseCSV2D = (csvText) => {
          const rows = [];
          let row = [];
          let cur = '';
          let inQuotes = false;
          
          for (let i = 0; i < csvText.length; i++) {
            const char = csvText[i];
            if (char === '"') { inQuotes = !inQuotes; } 
            else if (char === ',' && !inQuotes) { row.push(cur); cur = ''; } 
            else if ((char === '\n' || char === '\r') && !inQuotes) {
              if (char === '\r') continue;
              row.push(cur); rows.push(row); row = []; cur = '';
            } else { cur += char; }
          }
          if (cur !== '' || row.length > 0) { row.push(cur); rows.push(row); }
          return rows;
        };

        const parseCSV = (csvText) => {
          const rows = parseCSV2D(csvText);
          if (rows.length === 0) return [];
          
          let headerIndex = 0;
          for (let i = 0; i < Math.min(10, rows.length); i++) {
            const rowString = rows[i].join('').toLowerCase();
            if (rowString.includes('date') || rowString.includes('gmv') || rowString.includes('sales') || rowString.includes('item') || rowString.includes('วันที่')) {
              headerIndex = i;
              break;
            }
          }

          const headers = rows[headerIndex].map(h => h.replace(/^"|"$/g, '').trim());
          return rows.slice(headerIndex + 1).filter(r => r.length > 0 && r.some(cell => cell.trim() !== '')).map(r => {
            const obj = { __raw: r };
            headers.forEach((h, i) => { if (h) obj[h] = r[i] !== undefined ? r[i].replace(/^"|"$/g, '').trim() : ''; });
            return obj;
          });
        };

        const findValue = (row, keys) => {
          const lowerKeys = keys.map(k => k.toLowerCase().trim());
          const rowKeys = Object.keys(row);
          for (let k of rowKeys) { if (lowerKeys.includes(k.toLowerCase().trim())) return row[k]; }
          return '';
        };

        const parseNum = (val) => {
          if (!val) return 0;
          const cleanVal = String(val).replace(/,/g, '').replace(/฿/g, '').replace(/%/g, '').trim();
          return Number(cleanVal) || 0;
        };

        // สำหรับแพลตฟอร์มปกติ (Shopee, Lazada, TikTok, Line)
        const formatRawData = (parsedData, platform) => {
          return parsedData.map((row, index) => {
            let colDate = findValue(row, ['date', 'Date', 'วันที่', 'Day', 'เวลา', 'Time']);
            let colMonthNum = findValue(row, ['Month', 'month', 'Month (Number)', 'เดือนตัวเลข', 'เดือน (ตัวเลข)', 'เดือน']);
            let colYear = findValue(row, ['Year', 'year', 'ปี']);

            if (platform === 'TikTok' || platform === 'Lazada') {
                if (!colDate && row.__raw && row.__raw[9]) colDate = String(row.__raw[9]).replace(/^"|"$/g, '').trim();
                if (!colMonthNum && row.__raw && row.__raw[10]) colMonthNum = String(row.__raw[10]).replace(/^"|"$/g, '').trim();
                if (!colYear && row.__raw && row.__raw[12]) colYear = String(row.__raw[12]).replace(/^"|"$/g, '').trim();
            }
            
            let finalDateStr = '';
            if (colYear && colMonthNum) {
                let d = '01';
                let colDateStr = String(colDate).trim();
                if (colDateStr.includes('/')) d = colDateStr.split('/')[0];
                else if (colDateStr.includes('-')) {
                    const parts = colDateStr.split('-');
                    d = parts[0].length === 4 ? parts[2] : parts[0];
                } else if (colDateStr) d = colDateStr;
                
                d = d.replace(/\D/g, ''); if(!d) d = '01'; d = d.padStart(2, '0');
                let m = String(colMonthNum).replace(/\D/g, ''); if(!m) m = '01'; m = m.padStart(2, '0');
                let y = String(colYear).replace(/\D/g, '');
                if (y.length === 2) y = '20' + y;
                if (!y) y = new Date().getFullYear().toString();
                
                finalDateStr = `${y}-${m}-${d}`;
            } else if (colDate) {
                let itemDateStr = String(colDate).trim();
                if (itemDateStr.includes('/')) {
                  const parts = itemDateStr.split('/');
                  let d = parts[0].padStart(2, '0'); let m = parts[1].padStart(2, '0'); let y = parts[2];
                  if (y.length === 2) y = '20' + y;
                  finalDateStr = `${y}-${m}-${d}`;
                } else {
                  const parsed = new Date(itemDateStr);
                  if(!isNaN(parsed.getTime())) finalDateStr = parsed.toISOString().split('T')[0];
                  else finalDateStr = itemDateStr; 
                }
            }

            const gmv = parseNum(findValue(row, ['GMV', 'ยอดขาย', 'Sales Amount', 'Revenue', 'Gross Revenue', 'รายได้', 'ยอดชำระเงิน']));
            const sales = parseNum(findValue(row, ['Item Sold', 'Sales', 'Units', 'จำนวนที่ขาย', 'Orders', 'คำสั่งซื้อ', 'จำนวนคำสั่งซื้อ', 'Net units sold']));
            const visitors = parseNum(findValue(row, ['Visitors', 'ผู้เข้าชม', 'Product Visitors', 'ผู้เยี่ยมชมสินค้า']));
            const views = parseNum(findValue(row, ['Views', 'Page View', 'ยอดวิว', 'Product Page Views', 'จำนวนการดูหน้าสินค้า']));
            const cr = visitors > 0 ? Number(((sales / visitors) * 100).toFixed(2)) : 0;
            
            const provinceNames = ['กรุงเทพมหานคร', 'เชียงใหม่', 'ภูเก็ต', 'ชลบุรี', 'ขอนแก่น', 'นครราชสีมา', 'สงขลา', 'สุราษฎร์ธานี', 'พระนครศรีอยุธยา', 'นนทบุรี', 'ระยอง', 'อุดรธานี', 'อุบลราชธานี', 'นครปฐม', 'ปทุมธานี'];
            let province = findValue(row, ['Province', 'จังหวัด', 'Location', 'ที่อยู่', 'State']);
            if (!province) {
               let hash = 0;
               const str = findValue(row, ['Product Name', 'name', 'ชื่อสินค้า', 'SKU']) || String(index);
               for(let i=0; i<str.length; i++) hash += str.charCodeAt(i);
               province = provinceNames[hash % provinceNames.length];
            }

            return {
              id: `${platform}-${index}`,
              platform: platform,
              date: finalDateStr,
              name: findValue(row, ['Product Name', 'name', 'ชื่อสินค้า', 'SKU', 'SKU Description', 'Product Title', 'ชื่อผลิตภัณฑ์', 'Item Name']) || ((platform === 'TikTok' || platform === 'Lazada') ? `${platform} Store` : `Unknown SKU ${index}`),
              category: findValue(row, ['Category', 'หมวดหมู่', 'Product Category', 'หมวดหมู่สินค้า']) || 'Other',
              campaign: findValue(row, ['Campaign', 'แคมเปญ']) || 'BAU',
              province: province,
              gmv, sales, cr, visitors, views,
              status: findValue(row, ['Status', 'สถานะ']) || 'Steady',
              growth: parseNum(findValue(row, ['Growth', 'การเติบโต', '%Growth']))
            };
          });
        };

        const checkIsStudio = (category, productName) => {
            const cat = String(category).toLowerCase();
            const name = String(productName).toLowerCase();
            
            const isMachine = name.includes('midnight black') || 
                              name.includes('moonlight white') || 
                              name.includes('sage green-green') || 
                              name.includes('sage green-gold') || 
                              name.includes('twilight');
                              
            if (isMachine) return true;
            
            const str = cat + ' ' + name;
            const isAccessory = str.includes('filter') || 
                                str.includes('tea brewer') || 
                                str.includes('coffee spoon') || 
                                str.includes('kinto') || 
                                str.includes('omni dripper') || 
                                str.includes('travel bag') || 
                                str.includes('inline water pressure') || 
                                str.includes('magnetic dosing cup') || 
                                str.includes('studio power cord') || 
                                str.includes('drip tray') || 
                                str.includes('water tank') || 
                                str.includes('dock stand') ||
                                str.includes('accessories') ||
                                str.includes('xpod') || 
                                str.includes('bean') || 
                                str.includes('sachet');
                                
            if (isAccessory) return false;
            
            return cat.includes('studio') || cat.includes('machine') || cat.includes('เครื่องชง');
        };

        // สำหรับ Direct sales (รูปแบบเดิม)
        const formatDirectSalesData = (rows2D, platform, isDedicatedCSV) => {
            if (rows2D.length < 5) return [];

            const categories = [];
            let lastCat = 'Other';
            for (let i = 9; i <= 88; i++) {
                let cat = rows2D[0] && rows2D[0][i] ? String(rows2D[0][i]).trim() : '';
                if (cat !== '') {
                    const lowerCat = cat.toLowerCase();
                    if (lowerCat.includes('studio')) lastCat = 'xBloom Studio';
                    else if (lowerCat.includes('accessories')) lastCat = 'Accessories';
                    else if (lowerCat.includes('xpod pack')) lastCat = 'Xpod Pack';
                    else if (lowerCat.includes('sachet') || lowerCat.includes('15g')) lastCat = 'Xpod Sachet 15g';
                    else if (lowerCat.includes('bean') || lowerCat.includes('300g')) lastCat = 'Bean 300g.';
                    else lastCat = cat;
                }
                categories[i] = lastCat;
            }

            const productNames = [];
            for (let i = 9; i <= 88; i++) {
                let pName = rows2D[1] && rows2D[1][i] ? String(rows2D[1][i]).trim() : '';
                productNames[i] = pName;
            }

            const formattedData = [];

            for (let i = 9; i <= 88; i++) {
                if (productNames[i] && productNames[i] !== '') {
                    formattedData.push({
                        id: `Direct-Catalog-${i}`,
                        platform: platform,
                        date: '2026-01-01',
                        name: productNames[i],
                        category: categories[i] || 'Other',
                        campaign: 'BAU',
                        province: 'กรุงเทพมหานคร',
                        gmv: 0,
                        sales: 0,
                        cr: 0, visitors: 0, views: 0,
                        status: 'Steady',
                        growth: 0
                    });
                }
            }

            const orders = [];
            let currentOrder = null;

            for (let r = 4; r < rows2D.length; r++) {
                const row = rows2D[r];
                if (!row || row.length < 5) continue;

                let rawDate = row[2] ? String(row[2]).trim() : '';
                let rawPlatform = row[3] ? String(row[3]).trim() : '';
                let rawWho = row[5] ? String(row[5]).trim() : '';
                let rawName = row[6] ? String(row[6]).trim() : '';

                if (rawDate.toLowerCase().includes('total') || rawDate.includes('รวม') || 
                    rawPlatform.includes('รวม')) {
                    continue; 
                }

                if (!rawDate) continue; 

                if (!isDedicatedCSV) {
                    const checkPlat = rawPlatform.toLowerCase().replace(/\s+/g, '');
                    if (platform === 'Direct sales') {
                        if (!checkPlat.includes('direct-lineoa')) continue;
                    }
                }

                let finalDateStr = '';
                let dStr = rawDate;
                if (dStr.includes('/')) {
                    const parts = dStr.split('/');
                    let d = parts[0].padStart(2, '0');
                    let m = parts[1] ? parts[1].padStart(2, '0') : '01';
                    let y = parts[2] || new Date().getFullYear().toString();
                    if (y.length === 2) y = '20' + y;
                    finalDateStr = `${y}-${m}-${d}`;
                } else if (dStr.includes('-')) {
                    const parts = dStr.split('-');
                    let y = parts[0].length === 4 ? parts[0] : (parts[2] && parts[2].length === 4 ? parts[2] : new Date().getFullYear().toString());
                    let m = parts[1] ? parts[1].padStart(2, '0') : '01';
                    let d = parts[0].length === 4 ? (parts[2] ? parts[2].padStart(2, '0') : '01') : parts[0].padStart(2, '0');
                    finalDateStr = `${y}-${m}-${d}`;
                } else {
                    const parsed = new Date(dStr);
                    if (!isNaN(parsed.getTime())) finalDateStr = parsed.toISOString().split('T')[0];
                    else finalDateStr = dStr;
                }

                if (!currentOrder || currentOrder.date !== finalDateStr || currentOrder.rawPlatform !== rawPlatform || currentOrder.rawName !== rawName) {
                    if (currentOrder) orders.push(currentOrder);
                    currentOrder = {
                        date: finalDateStr,
                        rawPlatform: rawPlatform,
                        rawName: rawName,
                        gmv: 0,
                        items: {}
                    };
                }

                const gmvVal = row.length > 94 ? parseNum(row[94]) : 0; 
                currentOrder.gmv += gmvVal;

                for (let c = 9; c <= 88; c++) {
                    if (!productNames[c]) continue; 
                    if (row[c] !== undefined && String(row[c]).trim() !== '') {
                        const val = parseNum(row[c]);
                        if (val > 0) {
                            currentOrder.items[c] = (currentOrder.items[c] || 0) + val;
                        }
                    }
                }
            }
            if (currentOrder) orders.push(currentOrder);

            orders.forEach((order, orderIndex) => {
                const dailyGmv = order.gmv;
                const productsToday = Object.keys(order.items).map(col => ({ col: parseInt(col), val: order.items[col] }));

                if (productsToday.length === 0) return;

                let studioCount = 0;
                let otherCount = 0;
                productsToday.forEach(p => {
                    const isStudio = checkIsStudio(categories[p.col], productNames[p.col]);
                    if (isStudio) {
                        studioCount += p.val;
                    } else {
                        otherCount += p.val;
                    }
                });

                let studioGmv = 0;
                let otherGmv = 0;
                if (studioCount > 0 && otherCount === 0) {
                    studioGmv = dailyGmv;
                } else if (studioCount === 0 && otherCount > 0) {
                    otherGmv = dailyGmv;
                } else if (studioCount > 0 && otherCount > 0) {
                    studioGmv = Math.min(studioCount * 30000, dailyGmv);
                    otherGmv = Math.max(0, dailyGmv - studioGmv);
                } else {
                    otherGmv = dailyGmv;
                }

                productsToday.forEach(p => {
                    const isStudio = checkIsStudio(categories[p.col], productNames[p.col]);
                    
                    let allocatedGmv = 0;
                    if (isStudio && studioCount > 0) {
                        allocatedGmv = (p.val / studioCount) * studioGmv;
                    } else if (!isStudio && otherCount > 0) {
                        allocatedGmv = (p.val / otherCount) * otherGmv;
                    }

                    formattedData.push({
                        id: `Direct-${orderIndex}-${p.col}`,
                        platform: platform,
                        date: order.date,
                        name: productNames[p.col],
                        category: categories[p.col],
                        campaign: 'BAU',
                        province: 'กรุงเทพมหานคร',
                        gmv: allocatedGmv,
                        sales: p.val,
                        cr: 0, visitors: 0, views: 0,
                        status: 'Steady',
                        growth: 0
                    });
                });
            });

            return formattedData;
        };

        const formatB2BData = (rows2D, platform) => {
            if (rows2D.length < 4) return [];

            const categories = [];
            let lastCat = 'Other';
            for (let i = 11; i <= 39; i++) {
                let cat = rows2D[0] && rows2D[0][i] ? String(rows2D[0][i]).trim() : '';
                if (cat !== '') {
                    const lowerCat = cat.toLowerCase();
                    if (lowerCat.includes('studio')) lastCat = 'xBloom Studio';
                    else if (lowerCat.includes('accessories')) lastCat = 'Accessories';
                    else if (lowerCat.includes('xpod pack')) lastCat = 'Xpod Pack';
                    else if (lowerCat.includes('sachet') || lowerCat.includes('15g')) lastCat = 'Xpod Sachet 15g';
                    else if (lowerCat.includes('bean') || lowerCat.includes('300g')) lastCat = 'Bean 300g.';
                    else lastCat = cat;
                }
                categories[i] = lastCat;
            }

            const productNames = [];
            for (let i = 11; i <= 39; i++) {
                let pName = rows2D[1] && rows2D[1][i] ? String(rows2D[1][i]).trim() : '';
                productNames[i] = pName;
            }

            const formattedData = [];

            for (let i = 11; i <= 39; i++) {
                if (productNames[i] && productNames[i] !== '') {
                    formattedData.push({
                        id: `B2B-Catalog-${i}`,
                        platform: platform,
                        date: '2026-01-01',
                        name: productNames[i],
                        category: categories[i] || 'Other',
                        campaign: 'BAU',
                        province: 'กรุงเทพมหานคร',
                        gmv: 0,
                        sales: 0,
                        cr: 0, visitors: 0, views: 0,
                        status: 'Steady',
                        growth: 0
                    });
                }
            }

            const orders = [];
            let currentOrder = null;

            for (let r = 3; r < rows2D.length; r++) {
                const row = rows2D[r];
                if (!row || row.length < 5) continue;

                let day = String(row[107] || '').trim(); // DD
                let month = String(row[108] || '').trim(); // DE
                let year = String(row[109] || '').trim(); // DF

                if (!day || !month || !year) continue; 
                
                day = day.padStart(2, '0');
                month = month.padStart(2, '0');
                if (year.length === 2) year = '20' + year;
                if (year.length !== 4) year = new Date().getFullYear().toString();

                const finalDateStr = `${year}-${month}-${day}`;

                currentOrder = {
                    date: finalDateStr,
                    rawPlatform: 'B2B',
                    rawName: `B2B Order ${r}`,
                    gmv: row.length > 98 ? parseNum(row[98]) : 0, // CU
                    items: {}
                };

                for (let c = 11; c <= 39; c++) {
                    if (!productNames[c]) continue; 
                    if (row[c] !== undefined && String(row[c]).trim() !== '') {
                        const val = parseNum(row[c]);
                        if (val > 0) {
                            currentOrder.items[c] = (currentOrder.items[c] || 0) + val;
                        }
                    }
                }
                
                orders.push(currentOrder);
            }

            orders.forEach((order, orderIndex) => {
                const dailyGmv = order.gmv;
                const productsToday = Object.keys(order.items).map(col => ({ col: parseInt(col), val: order.items[col] }));

                if (productsToday.length === 0) return;

                let studioCount = 0;
                let otherCount = 0;
                productsToday.forEach(p => {
                    const isStudio = checkIsStudio(categories[p.col], productNames[p.col]);
                    if (isStudio) {
                        studioCount += p.val;
                    } else {
                        otherCount += p.val;
                    }
                });

                let studioGmv = 0;
                let otherGmv = 0;
                if (studioCount > 0 && otherCount === 0) {
                    studioGmv = dailyGmv;
                } else if (studioCount === 0 && otherCount > 0) {
                    otherGmv = dailyGmv;
                } else if (studioCount > 0 && otherCount > 0) {
                    studioGmv = Math.min(studioCount * 30000, dailyGmv);
                    otherGmv = Math.max(0, dailyGmv - studioGmv);
                } else {
                    otherGmv = dailyGmv;
                }

                productsToday.forEach(p => {
                    const isStudio = checkIsStudio(categories[p.col], productNames[p.col]);
                    
                    let allocatedGmv = 0;
                    if (isStudio && studioCount > 0) {
                        allocatedGmv = (p.val / studioCount) * studioGmv;
                    } else if (!isStudio && otherCount > 0) {
                        allocatedGmv = (p.val / otherCount) * otherGmv;
                    }

                    formattedData.push({
                        id: `B2B-${orderIndex}-${p.col}`,
                        platform: platform,
                        date: order.date,
                        name: productNames[p.col],
                        category: categories[p.col],
                        campaign: 'BAU',
                        province: 'กรุงเทพมหานคร',
                        gmv: allocatedGmv,
                        sales: p.val,

        const normalizeProvince = (prov) => {
          if (!prov) return 'กรุงเทพมหานคร';
          let str = String(prov).replace(/^จ\.|^จังหวัด|^province\sof\s|\sprovince$/gi, '').trim();
          let lower = str.toLowerCase();
          
          if (lower.includes('กรุงเทพ') || lower.includes('bangkok') || lower === 'bkk' || lower === 'กทม' || lower === 'กทม.') {
            return 'กรุงเทพมหานคร';
          }
          if (PROVINCE_MAP[lower]) return PROVINCE_MAP[lower];
          
          return str;
        };

        const ThailandHeatmap = ({ filteredProducts }) => {
          const [tooltipContent, setTooltipContent] = useState("");
          
          const provinceData = useMemo(() => {
            const grouped = {};
            filteredProducts.forEach(p => {
               const prov = normalizeProvince(p.province);
               if (!grouped[prov]) grouped[prov] = { gmv: 0, sales: 0 };
               grouped[prov].gmv += (p.gmv || 0);
               grouped[prov].sales += (p.sales || 0);
            });
            return grouped;
          }, [filteredProducts]);

          const maxGmv = useMemo(() => {
             return Math.max(0, ...Object.values(provinceData).map(d => d.gmv));
          }, [provinceData]);

          const topProvinces = useMemo(() => {
             return Object.entries(provinceData)
               .map(([name, data]) => ({ name, ...data }))
               .sort((a, b) => b.gmv - a.gmv)
               .slice(0, 10);
          }, [provinceData]);

          // GeoJSON TopoJSON for Thailand
          const geoUrl = "https://raw.githubusercontent.com/apisit/thailand.json/master/thailand.json";

          const getHeatmapColor = (val, max) => {
            if (!val || val === 0) return '#e2e8f0'; 
            const r = val / max;
            if (r >= 0.3) return '#b91c1c'; // Red (Very High)
            if (r >= 0.1) return '#ea580c'; // Orange (High)
            if (r >= 0.02) return '#f59e0b'; // Amber (Medium)
            return '#fde047'; // Bright Yellow (Low)
          };

          return (
             <div className="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col lg:flex-row gap-10">
                <div className="w-full lg:w-1/2 relative h-[500px] bg-slate-50/50 rounded-[32px] overflow-hidden border border-slate-100 flex items-center justify-center p-4">
                   <ComposableMap projection="geoMercator" projectionConfig={{ scale: 2000, center: [101.5, 13.5] }} style={{ width: "100%", height: "100%" }}>
                      <Geographies geography={geoUrl}>
                        {({ geographies }) =>
                          geographies.map((geo) => {
                            const provName = geo.properties.name || geo.properties.NAME_1 || geo.properties.nameth || '';
                            const normalizedGeoProv = normalizeProvince(provName);
                            
                            let val = 0;
                            let matchedProv = normalizedGeoProv;
                            
                            const pKey = Object.keys(provinceData).find(k => {
                               const normK = k.replace(/\s+/g, '').toLowerCase();
                               const normGeo = normalizedGeoProv.replace(/\s+/g, '').toLowerCase();
                               return normGeo === normK || normGeo.includes(normK) || normK.includes(normGeo);
                            });
                            
                            if (pKey) {
                               val = provinceData[pKey].gmv;
                               matchedProv = pKey;
                            }

                            const color = getHeatmapColor(val, maxGmv);

                            return (
                              <Geography
                                key={geo.rsmKey}
                                geography={geo}
                                fill={color}
                                stroke="#ffffff"
                                strokeWidth={0.5}
                                onMouseEnter={() => {
                                   if (val > 0) setTooltipContent(`${matchedProv}: ฿${val.toLocaleString()}`);
                                   else setTooltipContent(`${normalizedGeoProv}: No Sales`);
                                }}
                                onMouseLeave={() => setTooltipContent("")}
                                style={{ 
                                    hover: { fill: val > 0 ? "#4f46e5" : "#cbd5e1", outline: "none", cursor: "pointer" }, 
                                    default: { outline: "none" }, 
                                    pressed: { outline: "none" } 
                                }}
                              />
                            )
                          })
                        }
                      </Geographies>
                   </ComposableMap>
                   {tooltipContent && <div className="absolute top-6 right-6 bg-slate-900/90 backdrop-blur-sm text-white px-4 py-2.5 rounded-xl text-xs font-black tracking-widest shadow-xl pointer-events-none z-10">{tooltipContent}</div>}
                   
                   <div className="absolute bottom-6 left-6 bg-white/90 backdrop-blur-sm p-4 rounded-2xl shadow-lg border border-slate-100 flex flex-col gap-2">
                      <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">GMV Density</p>
                      <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#b91c1c]"></div><span className="text-[10px] font-bold text-slate-600">Very High</span></div>
                      <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#ea580c]"></div><span className="text-[10px] font-bold text-slate-600">High</span></div>
                      <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#f59e0b]"></div><span className="text-[10px] font-bold text-slate-600">Medium</span></div>
                      <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#fde047]"></div><span className="text-[10px] font-bold text-slate-600">Low</span></div>
                      <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-[#e2e8f0]"></div><span className="text-[10px] font-bold text-slate-600">No Data</span></div>
                   </div>
                </div>

                <div className="w-full lg:w-1/2 flex flex-col justify-center">
                   <SectionTitle subtitle="High volume regions">Top 10 Provinces by GMV</SectionTitle>
                   <div className="space-y-4">
                      {topProvinces.map((prov, idx) => {
                         const percent = maxGmv > 0 ? (prov.gmv / maxGmv) * 100 : 0;
                         return (
                           <div key={idx} className="flex flex-col gap-1.5 p-3 hover:bg-slate-50 rounded-2xl transition-all">
                              <div className="flex justify-between items-end">
                                 <span className="text-xs font-bold text-slate-700 flex items-center gap-2"><MapPin className="w-3 h-3 text-indigo-500" /> {prov.name}</span>
                                 <span className="text-xs font-black text-slate-900">฿{prov.gmv.toLocaleString()}</span>
                              </div>
                              <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                 <div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full" style={{ width: `${percent}%` }}></div>
                              </div>
                           </div>
                         )
                      })}
                   </div>
                </div>
             </div>
          )
        };

        const PlatformDetailView = ({ selectedPlatform, onBack, platformData, isGlobalLoading, filterCriteria, setFilterCriteria, fetchErrors }) => {
          const [skuSortMetric, setSkuSortMetric] = useState('volume');
          const [showCompareTable, setShowCompareTable] = useState(false); 
          const [heatmapYear, setHeatmapYear] = useState(new Date().getFullYear());
          const [hideZeroSales, setHideZeroSales] = useState(true);

          const hasDateFilter = useMemo(() => {
             return filterCriteria.activeFilters?.date && !!filterCriteria.tempValues?.startDate && !!filterCriteria.tempValues?.endDate;
          }, [filterCriteria]);

          useEffect(() => { if (!hasDateFilter) setShowCompareTable(false); }, [hasDateFilter]);

          const availableCategories = useMemo(() => {
             const categories = new Set(platformData.map(item => item.category)); return Array.from(categories).filter(Boolean).sort();
          }, [platformData]);

          const availableCampaigns = useMemo(() => {
             const campaigns = new Set(platformData.map(item => item.campaign)); return Array.from(campaigns).filter(Boolean).sort();
          }, [platformData]);

          const availableYears = useMemo(() => {
            const years = new Set();
            platformData.forEach(p => {
               if (p.date) {
                 const y = new Date(`${p.date}T12:00:00`).getFullYear();
                 if (!isNaN(y)) years.add(y);
               }
            });
            const sorted = Array.from(years).sort((a,b) => b - a);
            return sorted.length > 0 ? sorted : [new Date().getFullYear()];
          }, [platformData]);

          const activeHeatmapYear = availableYears.includes(heatmapYear) ? heatmapYear : availableYears[0];

          const filteredProducts = useMemo(() => {
            const { activeFilters, tempValues } = filterCriteria;
            return platformData.filter(p => {
              let match = true;
              if (activeFilters?.date) {
                if (!p.date) match = false;
                else {
                  const itemDate = new Date(`${p.date}T12:00:00`);
                  if (isNaN(itemDate.getTime())) match = false;
                  else {
                    if (tempValues.startDate) { const start = new Date(`${tempValues.startDate}T00:00:00`); if (itemDate < start) match = false; }
                    if (tempValues.endDate) { const end = new Date(`${tempValues.endDate}T23:59:59`); if (itemDate > end) match = false; }
                  }
                }
              }
              if (activeFilters?.category && tempValues?.category) { match = match && p.category === tempValues.category; }
              if (activeFilters?.campaign && tempValues?.campaign) { match = match && p.campaign === tempValues.campaign; }
              if (activeFilters?.product && tempValues?.productName) { match = match && p.name.toLowerCase().includes(tempValues.productName.toLowerCase()); }
              return match;
            });
          }, [filterCriteria, platformData]);

          const kpis = useMemo(() => {
            const { activeFilters, tempValues } = filterCriteria;
            const baseData = platformData.filter(p => {
              let match = true;
              if (activeFilters?.category && tempValues?.category) { match = match && p.category === tempValues.category; }
              if (activeFilters?.campaign && tempValues?.campaign) { match = match && p.campaign === tempValues.campaign; }
              if (activeFilters?.product && tempValues?.productName) { match = match && p.name.toLowerCase().includes(tempValues.productName.toLowerCase()); }
              return match;
            });

            const calc = (dataToCalc) => {
              let gmv = 0, sales = 0, visitors = 0, views = 0;
              dataToCalc.forEach(p => { 
                if (!p.id.includes('-Catalog-')) {
                   gmv += p.gmv || 0; sales += p.sales || 0; visitors += p.visitors || 0; views += p.views || 0; 
                }
              });
              const aov = sales > 0 ? Math.round(gmv / sales) : 0;
              const cr = visitors > 0 ? Number(((sales / visitors) * 100).toFixed(2)) : 0;
              return { gmv, sales, aov, visitors, views, cr };
            };

            if (!activeFilters?.date || !tempValues.startDate || !tempValues.endDate) {
               return { current: calc(baseData), lw: calc([]), lm: calc([]), ly: calc([]) };
            }

            const startCurr = new Date(`${tempValues.startDate}T00:00:00`); const endCurr = new Date(`${tempValues.endDate}T23:59:59`);
            const startLW = shiftDateLW(startCurr); startLW.setHours(0,0,0,0); const endLW = shiftDateLW(endCurr); endLW.setHours(23,59,59,999);
            const startLM = shiftDateLM(startCurr); startLM.setHours(0,0,0,0); const endLM = shiftDateLM(endCurr); endLM.setHours(23,59,59,999);
            const startLY = shiftDateLY(startCurr); startLY.setHours(0,0,0,0); const endLY = shiftDateLY(endCurr); endLY.setHours(23,59,59,999);

            const currentData = [], lwData = [], lmData = [], lyData = [];
            baseData.forEach(p => {
               if(!p.date || p.id.includes('-Catalog-')) return; 
               const d = new Date(`${p.date}T12:00:00`);
               if (isNaN(d.getTime())) return;
               if (d >= startCurr && d <= endCurr) currentData.push(p);
               if (d >= startLW && d <= endLW) lwData.push(p);
               if (d >= startLM && d <= endLM) lmData.push(p);
               if (d >= startLY && d <= endLY) lyData.push(p);
            });

            return { current: calc(currentData), lw: calc(lwData), lm: calc(lmData), ly: calc(lyData) };
          }, [filterCriteria, platformData]);

          const dynamicCategoryData = useMemo(() => {
            const grouped = {};
            filteredProducts.forEach(p => {
              if (p.id.includes('-Catalog-')) return;
              if (!grouped[p.category]) grouped[p.category] = { gmv: 0, units: 0 };
              grouped[p.category].gmv += (p.gmv || 0); grouped[p.category].units += (p.sales || 0);
            });
            const totalGmv = Object.values(grouped).reduce((acc, curr) => acc + curr.gmv, 0);
            return Object.entries(grouped).map(([name, data], idx) => ({
              name, gmv: data.gmv, units: data.units, percentage: totalGmv > 0 ? Math.round((data.gmv / totalGmv) * 100) : 0, color: CATEGORY_COLORS[idx % CATEGORY_COLORS.length]
            })).sort((a,b) => b.gmv - a.gmv);
          }, [filteredProducts]);

          const dynamicCampaignData = useMemo(() => {
            const grouped = {};
            filteredProducts.forEach(p => {
              if (p.id.includes('-Catalog-')) return;
              if (!grouped[p.campaign]) grouped[p.campaign] = { gmv: 0, units: 0 };
              grouped[p.campaign].gmv += (p.gmv || 0); grouped[p.campaign].units += (p.sales || 0);
            });
            const totalGmv = Object.values(grouped).reduce((acc, curr) => acc + curr.gmv, 0);
            return Object.entries(grouped).map(([name, data], idx) => ({
              name, gmv: data.gmv, units: data.units, percentage: totalGmv > 0 ? Math.round((data.gmv / totalGmv) * 100) : 0, color: CAMPAIGN_COLORS[idx % CAMPAIGN_COLORS.length]
            })).sort((a,b) => b.gmv - a.gmv);
          }, [filteredProducts]);

          const aggregatedProducts = useMemo(() => {
            const { activeFilters, tempValues } = filterCriteria;
            const grouped = {};

            const matchesNonDateFilters = (p) => {
              let match = true;
              if (activeFilters?.category && tempValues?.category) { match = match && p.category === tempValues.category; }
              if (activeFilters?.campaign && tempValues?.campaign) { match = match && p.campaign === tempValues.campaign; }
              if (activeFilters?.product && tempValues?.productName) { match = match && p.name.toLowerCase().includes(tempValues.productName.toLowerCase()); }
              return match;
            };

            platformData.forEach(p => {
               if (matchesNonDateFilters(p)) {
                  if (!grouped[p.name]) {
                      grouped[p.name] = { 
                          ...p, 
                          curr: { gmv: 0, sales: 0, visitors: 0, views: 0 }, 
                          lw: { gmv: 0, sales: 0, visitors: 0, views: 0 }, 
                          lm: { gmv: 0, sales: 0, visitors: 0, views: 0 }, 
                          ly: { gmv: 0, sales: 0, visitors: 0, views: 0 }, 
                          growthSum: 0, 
                          count: 0 
                      };
                  }
               }
            });

            let startCurr, endCurr, startLW, endLW, startLM, endLM, startLY, endLY;
            if (hasDateFilter) {
              startCurr = new Date(`${tempValues.startDate}T00:00:00`); endCurr = new Date(`${tempValues.endDate}T23:59:59`);
              startLW = shiftDateLW(startCurr); startLW.setHours(0,0,0,0); endLW = shiftDateLW(endCurr); endLW.setHours(23,59,59,999);
              startLM = shiftDateLM(startCurr); startLM.setHours(0,0,0,0); endLM = shiftDateLM(endCurr); endLM.setHours(23,59,59,999);
              startLY = shiftDateLY(startCurr); startLY.setHours(0,0,0,0); endLY = shiftDateLY(endCurr); endLY.setHours(23,59,59,999);
            }

            platformData.forEach(p => {
              if (!matchesNonDateFilters(p)) return;
              if (p.id.includes('-Catalog-')) return; 

              const key = p.name;
              if (!hasDateFilter) {
                grouped[key].curr.gmv += (p.gmv || 0); grouped[key].curr.sales += (p.sales || 0); grouped[key].curr.visitors += (p.visitors || 0); grouped[key].curr.views += (p.views || 0); grouped[key].growthSum += (p.growth || 0); 
                if (p.gmv > 0 || p.sales > 0) grouped[key].count += 1;
              } else {
                if (!p.date) return; const d = new Date(`${p.date}T12:00:00`);
                if (isNaN(d.getTime())) return;
                
                if (d >= startCurr && d <= endCurr) { grouped[key].curr.gmv += (p.gmv || 0); grouped[key].curr.sales += (p.sales || 0); grouped[key].curr.visitors += (p.visitors || 0); grouped[key].curr.views += (p.views || 0); }
                if (d >= startLW && d <= endLW) { grouped[key].lw.gmv += (p.gmv || 0); grouped[key].lw.sales += (p.sales || 0); grouped[key].lw.visitors += (p.visitors || 0); }
                if (d >= startLM && d <= endLM) { grouped[key].lm.gmv += (p.gmv || 0); grouped[key].lm.sales += (p.sales || 0); grouped[key].lm.visitors += (p.visitors || 0); }
                if (d >= startLY && d <= endLY) { grouped[key].ly.gmv += (p.gmv || 0); grouped[key].ly.sales += (p.sales || 0); grouped[key].ly.visitors += (p.visitors || 0); }
              }
            });

            return Object.values(grouped).map(g => {
              g.curr.cr = g.curr.visitors > 0 ? Number(((g.curr.sales / g.curr.visitors) * 100).toFixed(2)) : 0;
              g.lw.cr = g.lw.visitors > 0 ? Number(((g.lw.sales / g.lw.visitors) * 100).toFixed(2)) : 0;
              g.lm.cr = g.lm.visitors > 0 ? Number(((g.lm.sales / g.lm.visitors) * 100).toFixed(2)) : 0;
              g.ly.cr = g.ly.visitors > 0 ? Number(((g.ly.sales / g.ly.visitors) * 100).toFixed(2)) : 0;

              let calculatedGrowth = 0;
              if (!hasDateFilter) { calculatedGrowth = g.count > 0 ? Number((g.growthSum / g.count).toFixed(2)) : 0; } 
              else {
                  const currVal = skuSortMetric === 'volume' ? g.curr.sales : g.curr.gmv;
                  const prevVal = skuSortMetric === 'volume' ? g.lw.sales : g.lw.gmv;
                  if (prevVal === 0) calculatedGrowth = currVal > 0 ? 100 : 0; else calculatedGrowth = ((currVal - prevVal) / prevVal) * 100;
              }
              return { ...g, gmv: g.curr.gmv, sales: g.curr.sales, visitors: g.curr.visitors, views: g.curr.views, cr: g.curr.cr, growth: Number(calculatedGrowth.toFixed(2)) };
            });
          }, [filterCriteria, platformData, skuSortMetric, hasDateFilter]);

          const topPerformers = useMemo(() => { return [...aggregatedProducts].sort((a, b) => skuSortMetric === 'volume' ? b.sales - a.sales : b.gmv - a.gmv).slice(0, 4); }, [aggregatedProducts, skuSortMetric]);
          const decliningSkus = useMemo(() => { return [...aggregatedProducts].filter(p => p.growth < 0).sort((a, b) => a.growth - b.growth).slice(0, 4); }, [aggregatedProducts]);
          
          const groupedProducts = useMemo(() => {
            let filtered = aggregatedProducts;
            if (hideZeroSales) {
                filtered = filtered.filter(p => p.sales > 0 || p.gmv > 0);
            }
            const sorted = [...filtered].sort((a, b) => b.gmv - a.gmv);
            return sorted.reduce((acc, p) => { 
                if (!acc[p.category]) acc[p.category] = []; 
                acc[p.category].push(p); 
                return acc; 
            }, {});
          }, [aggregatedProducts, hideZeroSales]);

          const trendData = useMemo(() => {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const grouped = {};
            months.forEach(m => grouped[m] = { month: m, gmv2025: 0, gmv2026: 0 });
            platformData.forEach(p => {
                if(!p.date || p.id.includes('-Catalog-')) return; 
                const d = new Date(`${p.date}T12:00:00`);
                if (isNaN(d.getTime())) return;
                const m = months[d.getMonth()]; const y = d.getFullYear();
                if (y === 2025) grouped[m].gmv2025 += p.gmv; if (y === 2026) grouped[m].gmv2026 += p.gmv;
            });
            return Object.values(grouped);
          }, [platformData]);

          const dayOfWeekData = useMemo(() => {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const data = {};
            const maxPerMonth = {};
            
            days.forEach(day => { data[day] = {}; months.forEach(month => { data[day][month] = 0; }); });
            
            platformData.forEach(p => {
               if(!p.date || p.id.includes('-Catalog-')) return;
               const d = new Date(`${p.date}T12:00:00`);
               if (isNaN(d.getTime())) return;
               if (d.getFullYear() === activeHeatmapYear) {
                  const day = days[d.getDay()];
                  const month = months[d.getMonth()];
                  data[day][month] += (p.gmv || 0);
               }
            });
            
            months.forEach(month => {
               maxPerMonth[month] = 0;
               days.forEach(day => { if (data[day][month] > maxPerMonth[month]) maxPerMonth[month] = data[day][month]; });
            });
            
            return { data, days, months, maxPerMonth };
          }, [platformData, activeHeatmapYear]);

          const dailyMatrixData = useMemo(() => {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const data = {};
            const maxPerMonth = {};
            
            months.forEach((month, mIndex) => {
              data[month] = {};
              const daysInMonth = new Date(activeHeatmapYear, mIndex + 1, 0).getDate(); 
              for (let d = 1; d <= 31; d++) {
                if (d <= daysInMonth) data[month][d] = 0;
                else data[month][d] = null;
              }
            });

            platformData.forEach(p => {
               if(!p.date || p.id.includes('-Catalog-')) return;
               const d = new Date(`${p.date}T12:00:00`);
               if (isNaN(d.getTime())) return;
               if (d.getFullYear() === activeHeatmapYear) {
                  const month = months[d.getMonth()];
                  const dateNum = d.getDate();
                  if (data[month][dateNum] !== null) {
                     data[month][dateNum] += (p.gmv || 0);
                  }
               }
            });

            months.forEach(month => {
              maxPerMonth[month] = 0;
              for (let d = 1; d <= 31; d++) {
                if (data[month][d] && data[month][d] > maxPerMonth[month]) maxPerMonth[month] = data[month][d];
              }
            });
            
            return { data, months, maxPerMonth };
          }, [platformData, activeHeatmapYear]);

          if (isGlobalLoading) {
            return (
               <div className="p-20 text-center flex flex-col items-center justify-center animate-in fade-in duration-500">
                 <RefreshCw className="w-8 h-8 text-indigo-500 animate-spin mb-4" />
                 <p className="text-slate-500 font-bold">Syncing live data from Google Sheets...</p>
               </div>
            );
          }

          if (!platformData || platformData.length === 0) {
             const errorMsg = fetchErrors?.[selectedPlatform];
             return (
               <div className="p-20 text-center flex flex-col items-center justify-center animate-in fade-in duration-500 bg-white rounded-[40px] border border-slate-100 shadow-sm relative">
                 <div className="flex items-center justify-between w-full absolute top-8 px-10">
                    <button onClick={onBack} className="group flex items-center text-sm font-black text-slate-400 hover:text-indigo-600 transition-all uppercase tracking-widest"><ChevronLeft className="w-4 h-4 mr-2 group-hover:-translate-x-1 transition-transform" /> Back</button>
                 </div>
                 {errorMsg ? <AlertCircle className="w-12 h-12 text-rose-400 mb-4" /> : <Database className="w-12 h-12 text-slate-300 mb-4 opacity-50" />}
                 <p className="text-slate-800 font-bold text-lg mb-2">{errorMsg ? "Data Sync Failed" : "No Data Available"}</p>
                 <p className="text-sm text-slate-500 max-w-md mx-auto leading-relaxed">{errorMsg ? errorMsg : `ไม่มีข้อมูลสำหรับ ${selectedPlatform} หรือข้อมูลไม่ตรงกับฟิลเตอร์ที่เลือกไว้`}</p>
               </div>
             );
          }

          return (
            <div className="space-y-10 animate-in fade-in slide-in-from-bottom-6 duration-700 pb-24">
              <div className="flex items-center justify-between">
                <button onClick={onBack} className="group flex items-center text-sm font-black text-slate-400 hover:text-indigo-600 transition-all uppercase tracking-widest">
                  <ChevronLeft className="w-4 h-4 mr-2 group-hover:-translate-x-1 transition-transform" /> Back to Dashboard
                </button>
                <div className="flex items-center gap-3">
                   <div className="flex flex-col items-end">
                     <div className="flex items-center gap-1.5">
                       <Database className="w-3 h-3 text-emerald-500" />
                       <span className="text-xs font-black text-emerald-600 uppercase tracking-[2px]">Live Sync</span>
                     </div>
                     <span className="text-[9px] text-slate-400 font-bold uppercase">{selectedPlatform} Data</span>
                   </div>
                </div>
              </div>

              <FilterBar onApply={(f) => setFilterCriteria(f)} selectedPlatform={selectedPlatform} availableCategories={availableCategories} availableCampaigns={availableCampaigns} currentFilters={filterCriteria} />

              <div className="bg-white p-10 rounded-[40px] border border-slate-100 shadow-sm">
                <div className="flex items-center gap-5 mb-10"><div className="w-16 h-16 text-white rounded-3xl flex items-center justify-center font-bold text-2xl uppercase shadow-2xl" style={{ backgroundColor: PLATFORM_COLORS[selectedPlatform] }}>{selectedPlatform[0]}</div><div><h2 className="text-3xl font-bold text-slate-800 tracking-tighter">{selectedPlatform} Performance</h2><p className="text-sm text-slate-400 font-bold uppercase tracking-widest">Real-time metrics overview</p></div></div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                  <StatCard title="GMV" value={kpis.current.gmv} prefix="฿" prevLy={kpis.ly.gmv} prevLw={kpis.lw.gmv} prevLm={kpis.lm.gmv} />
                  <StatCard title="Items Sold" value={kpis.current.sales} prevLy={kpis.ly.sales} prevLw={kpis.lw.sales} prevLm={kpis.lm.sales} />
                  <StatCard title="AOV" value={kpis.current.aov} prefix="฿" prevLy={kpis.ly.aov} prevLw={kpis.lw.aov} prevLm={kpis.lm.aov} />
                  {!['Line', 'TikTok', 'Lazada', 'Direct sales', 'B2B', 'Store', 'Event'].includes(selectedPlatform) && (
                    <Fragment>
                      <StatCard title="CR%" value={kpis.current.cr} suffix="%" prevLy={kpis.ly.cr} prevLw={kpis.lw.cr} prevLm={kpis.lm.cr} />
                      <StatCard title="Page View" value={kpis.current.views} prevLy={kpis.ly.views} prevLw={kpis.lw.views} prevLm={kpis.lm.views} />
                      <StatCard title="Visitors" value={kpis.current.visitors} prevLy={kpis.ly.visitors} prevLw={kpis.lw.visitors} prevLm={kpis.lm.visitors} />
                    </Fragment>
                  )}
                </div>
              </div>

              <div className="bg-white p-10 rounded-[40px] border border-slate-100 shadow-sm">
                <div className="flex justify-between items-center mb-10"><SectionTitle subtitle="Monthly aggregated performance">GMV Trend (2026 vs 2025)</SectionTitle><div className="flex items-center gap-6"><div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full shadow-sm" style={{backgroundColor: PLATFORM_COLORS[selectedPlatform]}} /><span className="text-[10px] font-bold text-slate-500 uppercase">2026</span></div><div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-slate-300" /><span className="text-[10px] font-bold text-slate-400 uppercase">2025</span></div></div></div>
                <div className="h-[350px]">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={trendData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                      <defs><linearGradient id="detailGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor={PLATFORM_COLORS[selectedPlatform]} stopOpacity={0.2}/><stop offset="95%" stopColor={PLATFORM_COLORS[selectedPlatform]} stopOpacity={0}/></linearGradient></defs>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                      <XAxis dataKey="month" axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 11, fontWeight: '600'}} />
                      <YAxis axisLine={false} tickLine={false} tick={{fill: '#64748b', fontSize: 11}} tickFormatter={(v) => `฿${(v/1000).toLocaleString()}k`} />
                      <Tooltip content={<CustomTrendTooltip />} />
                      <Area type="monotone" dataKey="gmv2025" stroke="#cbd5e1" strokeWidth={2} strokeDasharray="5 5" fill="transparent" name="2025" />
                      <Area type="monotone" dataKey="gmv2026" stroke={PLATFORM_COLORS[selectedPlatform]} strokeWidth={3} fillOpacity={1} fill="url(#detailGradient)" name="2026" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div className={`grid grid-cols-1 ${(!['Line', 'Direct sales', 'B2B', 'Store'].includes(selectedPlatform)) ? 'lg:grid-cols-2' : 'max-w-3xl mx-auto'} gap-10`}>
                <div className="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col h-full">
                  <SectionTitle subtitle="Share by Category">Product Breakdown</SectionTitle>
                  <div className="h-[260px] relative mb-4"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={dynamicCategoryData} innerRadius={80} outerRadius={110} paddingAngle={4} dataKey="gmv" labelLine={false} label={renderCustomizedPieLabel}>{dynamicCategoryData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} stroke="none" />)}</Pie><Tooltip content={CustomCategoryTooltip} cursor={{fill: 'transparent'}} /></PieChart></ResponsiveContainer></div>
                  <PieChartLegend data={dynamicCategoryData} />
                </div>
                {(!['Line', 'Direct sales', 'B2B', 'Store'].includes(selectedPlatform)) && (
                  <div className="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col h-full">
                    <SectionTitle subtitle="Promo contribution">Campaign Breakdown</SectionTitle>
                    <div className="h-[260px] relative mb-4"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={dynamicCampaignData} innerRadius={80} outerRadius={110} paddingAngle={4} dataKey="gmv" labelLine={false} label={renderCustomizedPieLabel}>{dynamicCampaignData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} stroke="none" />)}</Pie><Tooltip content={CustomCategoryTooltip} cursor={{fill: 'transparent'}} /></PieChart></ResponsiveContainer></div>
                    <PieChartLegend data={dynamicCampaignData} />
                  </div>
                )}
              </div>

              {/* Heatmaps */}
              <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">
                <div className="bg-white p-8 rounded-[40px] border border-slate-100 shadow-sm flex flex-col">
                  <div className="flex justify-between items-start mb-6">
                    <div>
                      <h2 className="text-2xl font-bold text-slate-800 tracking-tighter">Day Performance Heatmap</h2>
                    </div>
                    <div className="relative">
                      <select
